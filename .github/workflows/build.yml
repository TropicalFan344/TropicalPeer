# Builds the Windows, macOS and Android apps with the same scripts people run
# locally. Every run keeps its builds as downloadable artifacts; pushing a tag
# like v0.1.4 also publishes them as a GitHub release.
#
# Update signing: the UPDATE_SIGNING_KEY secret signs each release's
# checksums so apps can update themselves (see internal/update).
#
# Android signing (optional): add these repository secrets to sign releases
# with your own key. Without them the APK is signed with a throwaway debug key,
# which installs fine but can't update a copy signed with a different key.
#   ANDROID_KEYSTORE_BASE64   base64 of the .jks file
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./internal/... ./locales ./mobile

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: powershell -ExecutionPolicy Bypass -File scripts/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release/*

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sh scripts/build-mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: release/*

  server:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sh scripts/build-server.sh
      - uses: actions/upload-artifact@v4
        with:
          name: server
          path: release/server/*

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: env.KEYSTORE != ''
        run: |
          mkdir -p frontend/android/keystore
          echo "$KEYSTORE" | base64 -d > frontend/android/keystore/release.jks
          {
            echo "storeFile=../keystore/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > frontend/android/keystore/keystore.properties
      - run: sh scripts/build-android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: release/*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, android, server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # Apps only install updates whose checksums carry this signature (see
      # internal/update). Without the secret the release is published
      # unsigned, and apps won't update to it.
      - name: Sign the release
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        if: env.UPDATE_SIGNING_KEY != ''
        run: go run ./cmd/signrelease -key env:UPDATE_SIGNING_KEY dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
